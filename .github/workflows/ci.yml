name: CI

# 推到 main 或对 main 发 PR 时跑：lint + 全量测试。
# 全程离线——测试用 fake runner / monkeypatch，不打真实 LLM，无需任何 API key。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/PR 的新推送取消旧的在跑任务，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 默认 job 超时是 6h；卡死的跑（死锁/等网络）别白烧满额度——全套测试 ~1 分钟，15 分钟极宽裕。
    timeout-minutes: 15
    # requires-python = ">=3.10"：在下限 3.10 到 3.12 全跑，确保最低支持版本不破。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: 装 uv（带依赖缓存）
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 装 Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # ruff 用 uvx 临时拉，不进 lock；与本地 `uvx ruff check` 一致。
      - name: Lint（ruff）
        run: uvx ruff check guanlan tests

      # --extra web 装上 fastapi/uvicorn/markdown，--extra mcp 装上 mcp SDK，否则 test_web.py /
      # test_aliases.py / test_mcp.py 会被 importorskip 跳过；dev 组（pytest）uv sync 默认带上。
      # --extra im-weixin / im-feishu（P4.21 决策P4.21-45，**不可省**）：不装的话
      # tests/test_im_feishu.py 里那条**真 SDK 签名探针**永远 skip，于是「lark-oapi 缺
      # extra_ua_tags 就收不到群 @ 事件」这条最关键的回归**永远不跑**——而它正是这组测试存在的理由。
      - name: 装依赖
        run: uv sync --extra web --extra mcp --extra im-weixin --extra im-feishu --python ${{ matrix.python-version }}

      # 上一步装齐四个 extra，但**没有任何东西验证它装成功了**——`pytest.importorskip` 的 skip
      # 在 CI 里照样是绿的（tests/test_im_feishu.py 里那条 skip 的理由甚至写着「CI 必装并必跑」，
      # 那只是一句注释）。故这里加一道闸：**CI 里出现任何 skip 即失败**。
      #
      # 立这道闸的依据是实测而非想当然：2026-09-13 三个 Python 版本在 CI 上都是 `1595 passed`、
      # 零 skip（本地 macOS 会跳 1 条——大小写不敏感的文件系统构造不出 Foo.md/foo.md 并存，
      # 而 Linux 上那条会真跑）。所以零 skip 是当下的事实，不是期望值。
      #
      # 限度（别高估它）：它只能证明**没有用例被跳过**，不能证明该有的用例都存在。
      # 若日后确有一条在 CI 上必须跳过的用例，正确做法是**显式**处理（deselect 或在此注明），
      # 而不是把这道闸摘掉——摘掉就回到「最关键的回归永远不跑，而 CI 一直是绿的」那个状态。
      - name: 跑测试（CI 不许静默跳过）
        run: |
          set -o pipefail
          uv run --extra web --extra mcp --extra im-weixin --extra im-feishu \
            --python ${{ matrix.python-version }} pytest -q -rs --color=no | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::CI 里有用例被跳过——最关键的回归可能根本没跑（多半是某个 extra 没装上）"
            grep '^SKIPPED' pytest.out || true
            exit 1
          fi

  # 改 workflow 时校验：YAML 语法 / action input / ${{ }} 表达式，并对 run: 里的内联 shell 跑 shellcheck
  # （release.yml 那段抽 CHANGELOG 的 awk/bash 由此受检）。单跑一次、不进 Python 矩阵。
  # 钉到 actionlint v1.7.12 的镜像 digest（SHA 钉版、可复现，非浮动 :latest）；镜像自带 shellcheck。
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
